name: Google Cloud WIF Authentication Test

on: push

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/91683110381/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-sa@project-03579b73-9334-41f1-b18.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authentication
        run: gcloud auth list
